<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract Intelligence — Select MATOC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-main: #0b0f17;
    --card-bg: rgba(22, 27, 34, 0.75);
    --card-hover-bg: rgba(30, 38, 48, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --border-hover: #388bfd;
    --text-primary: #f0f6fc;
    --text-secondary: #8b949e;
    --accent-blue: #388bfd;
    --accent-glow: rgba(56, 139, 253, 0.15);
    --admin-border: #d29922;
    --admin-glow: rgba(210, 153, 34, 0.15);
  }

  * { box-sizing: border-box; }

  body {
    background-color: var(--bg-main);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(58, 134, 255, 0.08) 0%, transparent 70%),
      radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.05) 0%, transparent 60%);
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    padding: 60px 24px;
  }

  .wrap {
    max-width: 1320px;
    width: 100%;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 0 0 10px 0;
    background: linear-gradient(180deg, #FFFFFF 0%, #C9D1D9 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.sub {
    color: var(--text-secondary);
    margin: 0;
    font-size: 15px;
    font-weight: 400;
  }

  /* Instant Search Bar */
  .search-container {
    max-width: 480px;
    margin: 0 auto 40px auto;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: rgba(22, 27, 34, 0.6);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px 16px 12px 42px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
  }

  .search-input:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px var(--accent-glow);
    background: rgba(22, 27, 34, 0.9);
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    fill: var(--text-secondary);
    pointer-events: none;
  }

  /* Grid Layout */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }

  /* Modern Glassmorphic Card */
  a.card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 120px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    text-decoration: none;
    color: var(--text-primary);
    backdrop-filter: blur(12px);
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                border-color 0.2s ease, 
                box-shadow 0.2s ease,
                background-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  a.card:hover {
    border-color: var(--border-hover);
    transform: translateY(-4px);
    background: var(--card-hover-bg);
    box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5), 0 0 16px var(--accent-glow);
  }

  /* Subtle accent indicator on top edge */
  a.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #388bfd, #79c0ff);
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  a.card:hover::before {
    opacity: 1;
  }

  .card .name {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.2px;
    margin-bottom: 12px;
  }

  .card .desc-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card .desc {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: color 0.2s ease;
  }

  .card:hover .desc {
    color: var(--accent-blue);
  }

  .card .arrow {
    width: 14px;
    height: 14px;
    fill: var(--text-secondary);
    transform: translateX(0);
    transition: transform 0.2s ease, fill 0.2s ease;
  }

  .card:hover .arrow {
    fill: var(--accent-blue);
    transform: translateX(3px);
  }

  /* Dedicated Admin Card Styling */
  a.card.admin-card {
    border-color: rgba(210, 153, 34, 0.3);
    background: rgba(27, 22, 16, 0.6);
  }

  a.card.admin-card::before {
    background: linear-gradient(90deg, #d29922, #f1e05a);
  }

  a.card.admin-card:hover {
    border-color: var(--admin-border);
    box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5), 0 0 16px var(--admin-glow);
  }

  a.card.admin-card .desc {
    color: #d29922;
  }

  a.card.admin-card:hover .arrow {
    fill: #d29922;
  }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: var(--text-secondary);
    display: none;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <h1>Contract Intelligence Dashboard</h1>
      <p class="sub">Select a MATOC to view its competitive pricing &amp; win/loss dashboard</p>
    </div>

    <!-- Search / Filter Input -->
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 16 16">
        <path d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.5 3.5a.75.75 0 1 1-1.06 1.06l-3.5-3.5zM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0z"/>
      </svg>
      <input type="text" id="matoc-search" class="search-input" placeholder="Search MATOC vehicle (e.g. NAVFAC, USACE)..." autocomplete="off">
    </div>

    <div class="grid" id="matoc-grid">
      {% for slug, label in matocs.items() %}
      <a class="card" href="{{ url_for('dashboard', slug=slug) }}" data-name="{{ label | lower }}">
        <div class="name">{{ label }}</div>
        <div class="desc-wrap">
          <span class="desc">View dashboard</span>
          <svg class="arrow" viewBox="0 0 16 16">
            <path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/>
          </svg>
        </div>
      </a>
      {% endfor %}

      {% if is_admin %}
      <a class="card admin-card" href="{{ url_for('admin_dashboard') }}" data-name="admin panel full website control">
        <div class="name">Admin Panel</div>
        <div class="desc-wrap">
          <span class="desc">Full Control</span>
          <svg class="arrow" viewBox="0 0 16 16">
            <path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/>
          </svg>
        </div>
      </a>
      {% endif %}

      <div class="no-results" id="no-results">No MATOC vehicles found matching your search.</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('matoc-search');
      const cards = document.querySelectorAll('#matoc-grid .card');
      const noResults = document.getElementById('no-results');

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        let visibleCount = 0;

        cards.forEach(card => {
          const name = card.getAttribute('data-name') || '';
          if (name.includes(query)) {
            card.style.display = 'flex';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });

        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
