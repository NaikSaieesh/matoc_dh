<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    background:#0D1117; margin:0; padding:0; font-family:Arial,sans-serif; color:#F0F6FC;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .login-panel {
    background:#161B22; border:1px solid #30363D; border-radius:12px;
    padding:32px; width:100%; max-width:360px; margin:20px;
  }
  h2 {
    color:#58A6FF; font-size:22px; margin:0 0 6px; text-align:center;
  }
  p.sub {
    color:#8B949E; margin:0 0 22px; font-size:13px; text-align:center;
  }
  .flash {
    background:#3d1418; border:1px solid #F85149; color:#F85149;
    padding:10px 14px; border-radius:8px; font-size:13px; margin:0 0 16px;
  }
  .field { margin-bottom:16px; }
  label {
    display:block; color:#8B949E; font-size:12px; font-weight:600;
    margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em;
  }
  input[type=text], input[type=password] {
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid #30363D;
    background:#0D1117; color:#F0F6FC; font-size:13px;
  }
  input[type=text]:focus, input[type=password]:focus {
    outline:none; border-color:#58A6FF;
  }
  button.btn-login {
    width:100%; margin-top:6px; padding:10px 12px; border-radius:8px;
    border:1px solid #1F6FEB; background:#1F6FEB; color:#fff;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  button.btn-login:hover { background:#388BFD; }

  .divider {
    display:flex; align-items:center; gap:10px; margin:20px 0;
    color:#8B949E; font-size:12px;
  }
  .divider::before, .divider::after {
    content:""; flex:1; height:1px; background:#30363D;
  }

  .btn-google {
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:10px 12px; border-radius:8px; border:1px solid #30363D;
    background:#FFFFFF; color:#1F1F1F; font-size:13px; font-weight:600;
    text-decoration:none; cursor:pointer;
  }
  .btn-google:hover { background:#F0F0F0; }
  .btn-google svg { width:18px; height:18px; }
</style>
</head>
<body>
  <div class="login-panel">
    <h2>MATOC INTEL LOGIN</h2>
    <p class="sub">Sign in to continue</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <div class="field">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button class="btn-login" type="submit">Log In</button>
    </form>

    <div class="divider">OR</div>

    <a class="btn-google" href="{{ url_for('login_google', next=next_url) }}">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
          <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
        Sign in with Google
    </a>

      <p style="margin-top: 15px;">
        Don't have an account? 
        <a href="{{ url_for('register', next=next_url) }}">Register here</a>
    </p>
  </div>
</body>
</html>
